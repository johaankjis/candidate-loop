[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "candidateloop-agent"
version = "0.1.0"
description = "Local-first recruiting operations agent service for CandidateLoop"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "strands-agents>=1.55,<2",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<10",
  "ruff>=0.11,<1",
]
[tool.hatch.build.targets.wheel]
packages = ["candidateloop", "api"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
